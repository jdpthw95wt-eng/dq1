<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>忘却の淵にて</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0806;
    --panel: #1a1410;
    --border: #6b4f2a;
    --border-light: #a07840;
    --text: #e8d5a0;
    --text-dim: #8a7050;
    --gold: #d4a843;
    --red: #c0392b;
    --blue: #2980b9;
    --green: #27ae60;
    --purple: #8e44ad;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Noto Serif JP', serif;
    color: var(--text);
    touch-action: none;
  }

  #game-container {
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ===== TITLE SCREEN ===== */
  #title-screen {
    position: absolute; inset: 0;
    background: #050403;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  #title-screen h1 {
    font-size: 2rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(212,168,67,0.5);
    letter-spacing: 0.15em;
    margin-bottom: 0.3em;
    animation: flicker 4s ease-in-out infinite;
  }
  #title-screen .subtitle {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    margin-bottom: 3em;
  }
  #title-screen .start-btn {
    border: 2px solid var(--border-light);
    color: var(--text);
    background: transparent;
    padding: 1em 2.5em;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 0.2em;
    animation: pulse-border 2s ease-in-out infinite;
  }
  @keyframes flicker {
    0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.7} 94%{opacity:1} 96%{opacity:0.85} 97%{opacity:1}
  }
  @keyframes pulse-border {
    0%,100%{border-color:var(--border-light);color:var(--text)}
    50%{border-color:var(--gold);color:var(--gold)}
  }

  /* ===== MAP ===== */
  #map-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }
  #map-canvas {
    position: absolute;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ===== STATUS BAR ===== */
  #status-bar {
    background: var(--panel);
    border-top: 2px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
  }
  #status-name {
    font-size: 0.85rem;
    color: var(--gold);
    min-width: 60px;
  }
  .stat-group { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .stat-row { display: flex; align-items: center; gap: 4px; }
  .stat-label { font-size: 0.6rem; color: var(--text-dim); min-width: 20px; }
  .stat-bar-bg {
    flex: 1; height: 8px;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .stat-bar-fill { height: 100%; transition: width 0.3s; }
  .hp-fill { background: linear-gradient(90deg, #c0392b, #e74c3c); }
  .mp-fill { background: linear-gradient(90deg, #1a5276, #2980b9); }
  .stat-val { font-size: 0.65rem; color: var(--text); min-width: 40px; text-align: right; }
  #gold-display {
    font-size: 0.75rem;
    color: var(--gold);
    text-align: right;
    min-width: 55px;
  }

  /* ===== MESSAGE WINDOW ===== */
  #message-window {
    background: var(--panel);
    border: 2px solid var(--border);
    border-left: none; border-right: none;
    min-height: 80px;
    padding: 10px 14px;
    position: relative;
  }
  #message-text {
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--text);
    min-height: 3em;
  }
  #message-cursor {
    display: inline-block;
    width: 10px; height: 10px;
    border-right: 2px solid var(--gold);
    border-bottom: 2px solid var(--gold);
    transform: rotate(45deg);
    margin-left: 6px;
    animation: blink-cursor 0.8s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes blink-cursor { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ===== COMMAND WINDOW ===== */
  #command-window {
    background: var(--panel);
    border-top: 2px solid var(--border);
    display: none;
    flex-direction: column;
  }
  #command-window.visible { display: flex; }

  .cmd-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .cmd-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 14px 0;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: background 0.1s, color 0.1s;
    position: relative;
  }
  .cmd-btn:active, .cmd-btn.selected {
    background: rgba(212,168,67,0.15);
    color: var(--gold);
  }
  .cmd-btn::before {
    content: '▶ ';
    opacity: 0;
    font-size: 0.7em;
  }
  .cmd-btn.selected::before { opacity: 1; }

  /* ===== BATTLE SCREEN ===== */
  #battle-screen {
    display: none;
    flex-direction: column;
    position: absolute; inset: 0;
    background: #050403;
    z-index: 50;
  }
  #battle-screen.visible { display: flex; }

  #battle-enemy-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(ellipse at center, #1a0f05 0%, #050403 70%);
  }
  #enemy-name-display {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
  }
  #enemy-sprite-area {
    width: 120px; height: 120px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  #enemy-canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #enemy-hp-bar {
    margin-top: 12px;
    width: 160px;
    height: 8px;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  #enemy-hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #8e2222, #c0392b);
    transition: width 0.4s;
  }

  #battle-log {
    background: var(--panel);
    border-top: 2px solid var(--border);
    border-bottom: 1px solid var(--border);
    min-height: 80px;
    padding: 10px 14px;
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--text);
  }

  #battle-commands {
    background: var(--panel);
    border-top: 2px solid var(--border);
  }
  #battle-status-mini {
    padding: 6px 14px;
    font-size: 0.75rem;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 12px;
  }

  /* ===== TRANSITION OVERLAY ===== */
  #transition {
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 200;
    transition: opacity 0.3s;
  }
  #transition.fade-in { opacity: 1; pointer-events: all; }

  /* ===== LEVEL UP OVERLAY ===== */
  #levelup-overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 60;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #levelup-overlay.visible { display: flex; }
  #levelup-overlay h2 {
    color: var(--gold);
    font-size: 1.4rem;
    letter-spacing: 0.2em;
    text-shadow: 0 0 20px rgba(212,168,67,0.8);
  }
  #levelup-overlay p { font-size: 0.85rem; color: var(--text); }

  /* ===== GAME OVER ===== */
  #gameover-screen {
    display: none;
    position: absolute; inset: 0;
    background: #000;
    z-index: 80;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  #gameover-screen.visible { display: flex; }
  #gameover-screen h2 {
    color: var(--red);
    font-size: 1.6rem;
    letter-spacing: 0.3em;
    animation: flicker 3s infinite;
  }
  #gameover-screen p { color: var(--text-dim); font-size: 0.85rem; }
  #gameover-screen button {
    margin-top: 1em;
    border: 2px solid var(--border-light);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.8em 2em;
    cursor: pointer;
    letter-spacing: 0.15em;
  }

  /* ===== DAMAGE FLOAT ===== */
  .damage-float {
    position: absolute;
    font-size: 1.4rem;
    font-weight: bold;
    pointer-events: none;
    animation: float-up 1.2s ease-out forwards;
    z-index: 10;
    text-shadow: 0 0 8px currentColor;
  }
  @keyframes float-up {
    0%{opacity:1;transform:translateY(0)}
    100%{opacity:0;transform:translateY(-60px)}
  }
  .dmg-enemy { color: #e74c3c; left: 50%; transform: translateX(-50%); bottom: 10px; }
  .dmg-player { color: #f39c12; left: 50%; transform: translateX(-50%); bottom: 10px; }
  .dmg-heal { color: #2ecc71; left: 50%; transform: translateX(-50%); bottom: 10px; }

  /* ===== SPELL SELECT ===== */
  #spell-window {
    display: none;
    background: var(--panel);
    border-top: 2px solid var(--border);
  }
  #spell-window.visible { display: block; }
  .spell-list { list-style: none; }
  .spell-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.1s;
  }
  .spell-item:active { background: rgba(212,168,67,0.1); }
  .spell-mp { color: var(--blue); font-size: 0.8rem; }
  .spell-disabled { color: var(--text-dim); }

  /* Item list same style */
  #item-window {
    display: none;
    background: var(--panel);
    border-top: 2px solid var(--border);
  }
  #item-window.visible { display: block; }
  .item-list { list-style: none; }
  .item-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.1s;
  }
  .item-item:active { background: rgba(212,168,67,0.1); }
  .item-count { color: var(--text-dim); font-size: 0.8rem; }
</style>
</head>
<body>

<div id="transition"></div>

<!-- TITLE -->
<div id="title-screen">
  <h1>忘却の淵にて</h1>
  <div class="subtitle">At the Edge of Oblivion</div>
  <button class="start-btn" onclick="startGame()">は じ め る</button>
</div>

<!-- GAME -->
<div id="game-container">

  <!-- MAP -->
  <div id="map-area">
    <canvas id="map-canvas"></canvas>
  </div>

  <!-- STATUS -->
  <div id="status-bar">
    <div id="status-name">騎士</div>
    <div class="stat-group">
      <div class="stat-row">
        <span class="stat-label">HP</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill hp-fill" id="hp-bar" style="width:100%"></div></div>
        <span class="stat-val" id="hp-val">45/45</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">MP</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill mp-fill" id="mp-bar" style="width:100%"></div></div>
        <span class="stat-val" id="mp-val">12/12</span>
      </div>
    </div>
    <div id="gold-display">💰 50G</div>
  </div>

  <!-- MESSAGE -->
  <div id="message-window">
    <div id="message-text"></div>
  </div>

  <!-- COMMAND -->
  <div id="command-window">
    <div class="cmd-grid">
      <button class="cmd-btn" onclick="openMenu('talk')">はなす</button>
      <button class="cmd-btn" onclick="openMenu('status')">ステータス</button>
      <button class="cmd-btn" onclick="openMenu('item')">どうぐ</button>
      <button class="cmd-btn" onclick="openMenu('search')">しらべる</button>
    </div>
  </div>

  <!-- BATTLE -->
  <div id="battle-screen">
    <div id="battle-enemy-area">
      <div id="enemy-name-display"></div>
      <div id="enemy-sprite-area">
        <canvas id="enemy-canvas" width="80" height="80"></canvas>
      </div>
      <div id="enemy-hp-bar"><div id="enemy-hp-fill" style="width:100%"></div></div>
      <div id="levelup-overlay">
        <h2>レベルアップ！</h2>
        <p id="levelup-text"></p>
      </div>
    </div>
    <div id="battle-log"></div>
    <div id="battle-commands">
      <div id="battle-status-mini">
        <span id="b-hp">HP: 45/45</span>
        <span id="b-mp">MP: 12/12</span>
      </div>
      <div id="spell-window">
        <ul class="spell-list" id="spell-list"></ul>
      </div>
      <div id="item-window">
        <ul class="item-list" id="item-list-battle"></ul>
      </div>
      <div class="cmd-grid" id="battle-cmd-grid">
        <button class="cmd-btn" onclick="battleAction('attack')">たたかう</button>
        <button class="cmd-btn" onclick="battleAction('spell')">じゅもん</button>
        <button class="cmd-btn" onclick="battleAction('item')">どうぐ</button>
        <button class="cmd-btn" onclick="battleAction('flee')">にげる</button>
      </div>
    </div>
  </div>

  <!-- GAMEOVER -->
  <div id="gameover-screen">
    <h2>あなたは　倒れた</h2>
    <p>深淵の闇が　あなたを　飲み込んだ……</p>
    <button onclick="respawn()">メルクリアへ　戻る</button>
  </div>

</div>

<script>

// ===== PLAYER =====

  hp: 45, maxHp: 45,

  atk: 12, def: 8,

  gold: 50,
  name: '騎士',

function resizeCanvas() {
  const area = document.getElementById('map-area');
  const w = area.clientWidth;
  const h = area.clientHeight;
  mapCanvas.width = VIEW_W * TILE;
  mapCanvas.height = VIEW_H * TILE;

// ===== TILE DRAWING =====
function drawTile(ctx, type, px, py, seed) {
  const cols = TILE_COLORS[type] || TILE_COLORS[T.GRASS];
  const ci = ((seed * 7 + py * 31 + px * 13) % 3 + 3) % 3;
  ctx.fillStyle = cols[ci];
  ctx.fillRect(px, py, TILE, TILE);

  // Details
  ctx.globalAlpha = 0.4;
  if (type === T.GRASS) {
    ctx.fillStyle = '#4a7a30';
    for (let i = 0; i < 3; i++) {
      const bx = px + ((seed*3+i*11+py)%28)+2;
      const by = py + ((seed*5+i*7+px)%24)+4;
      ctx.fillRect(bx, by, 2, 3);
    }
  } else if (type === T.WATER) {
    ctx.fillStyle = '#1a5070';
    ctx.fillRect(px+4, py+TILE/2-1, TILE-8, 2);
    ctx.fillRect(px+2, py+TILE/2+4, TILE-4, 2);
  } else if (type === T.MOUNTAIN || type === T.WALL) {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(px+TILE/2, py+4);
    ctx.lineTo(px+TILE-4, py+TILE-4);
    ctx.lineTo(px+4, py+TILE-4);
    ctx.closePath();
    ctx.fill();
  } else if (type === T.TREE) {
    ctx.fillStyle = '#1a4010';
    ctx.beginPath();
    ctx.arc(px+TILE/2, py+TILE/2-2, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#2a5c1a';
    ctx.beginPath();
    ctx.arc(px+TILE/2, py+TILE/2-4, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(px+TILE/2-2, py+TILE-8, 4, 8);
  } else if (type === T.RUIN) {
    ctx.fillStyle = '#444030';
    ctx.fillRect(px+4, py+4, 8, 8);
    ctx.fillRect(px+TILE-12, py+4, 8, 8);
    ctx.fillRect(px+4, py+TILE-12, 8, 8);
    ctx.fillStyle = '#222015';
    ctx.fillRect(px+4, py+TILE-12, 24, 8);
  } else if (type === T.TOWN) {
    ctx.fillStyle = '#7a5a2a';
    ctx.fillRect(px+6, py+6, TILE-12, TILE-12);
    ctx.fillStyle = '#4a3018';
    ctx.fillRect(px+6, py+6, TILE-12, 6);
  } else if (type === T.FLOOR) {
    ctx.fillStyle = '#2a1e10';
    if ((px/TILE + py/TILE)%2===0) {
      ctx.fillRect(px+1, py+1, TILE-2, TILE-2);
    }
  } else if (type === T.DOOR) {
    ctx.fillStyle = '#8a6030';
    ctx.fillRect(px+8, py+4, TILE-16, TILE-4);
    ctx.fillStyle = '#c09050';
    ctx.fillRect(px+TILE/2-1, py+TILE/2-4, 2, 8);
  } else if (type === T.CHEST) {
    ctx.fillStyle = '#8a6030';
    ctx.fillRect(px+6, py+10, TILE-12, TILE-16);
    ctx.fillStyle = '#c0a040';
    ctx.fillRect(px+6, py+8, TILE-12, 4);
    ctx.fillRect(px+TILE/2-2, py+12, 4, 4);
  } else if (type === T.NPC) {
    // floor with npc indicator
    ctx.fillStyle = '#5a9050';
    ctx.beginPath();
    ctx.arc(px+TILE/2, py+TILE/2-4, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#3a6030';
    ctx.fillRect(px+TILE/2-4, py+TILE/2+2, 8, 6);
  }
  ctx.globalAlpha = 1;
}

// ===== MAP RENDER =====
function renderMap() {
  const map = state.mapData;
  const rows = map.length, cols = map[0].length;
  const camX = Math.max(0, Math.min(player.x - Math.floor(VIEW_W/2), cols - VIEW_W));
  const camY = Math.max(0, Math.min(player.y - Math.floor(VIEW_H/2), rows - VIEW_H));

  mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);

  for (let row = 0; row < VIEW_H; row++) {
    for (let col = 0; col < VIEW_W; col++) {
      const mx = camX + col, my = camY + row;
      if (my < 0 || my >= rows || mx < 0 || mx >= cols) continue;
      const tile = map[my][mx];
      const seed = mx * 100 + my;
      drawTile(mapCtx, tile, col*TILE, row*TILE, seed);
    }
  }

  // Player
  const px = (player.x - camX) * TILE;
  const py = (player.y - camY) * TILE;
  drawPlayer(mapCtx, px, py);

  // Fog-like darkness at edges
  const grad = mapCtx.createRadialGradient(
    VIEW_W*TILE/2, VIEW_H*TILE/2, VIEW_W*TILE*0.3,
    VIEW_W*TILE/2, VIEW_H*TILE/2, VIEW_W*TILE*0.7
  );
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.5)');
  mapCtx.fillStyle = grad;
  mapCtx.fillRect(0, 0, VIEW_W*TILE, VIEW_H*TILE);
}

function drawPlayer(ctx, px, py) {
  ctx.globalAlpha = 1;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(px+TILE/2, py+TILE-4, 8, 4, 0, 0, Math.PI*2);
  ctx.fill();
  // Body
  ctx.fillStyle = '#8a7050';
  ctx.fillRect(px+10, py+14, 12, 14);
  // Head
  ctx.fillStyle = '#c0a070';
  ctx.beginPath();
  ctx.arc(px+TILE/2, py+11, 7, 0, Math.PI*2);
  ctx.fill();
  // Helmet
  ctx.fillStyle = '#707878';
  ctx.fillRect(px+9, py+4, 14, 7);
  ctx.fillRect(px+11, py+8, 10, 5);
  // Sword
  ctx.fillStyle = '#aaa8a0';
  ctx.fillRect(px+22, py+10, 3, 16);
  ctx.fillStyle = '#c0a030';
  ctx.fillRect(px+20, py+14, 7, 3);
  // Shield
  ctx.fillStyle = '#5a4a8a';
  ctx.fillRect(px+4, py+13, 7, 10);
}

// ===== ENEMY SPRITE =====
function drawEnemySprite(enemy) {
  const ctx = enemyCtx;
  ctx.clearRect(0, 0, 80, 80);
  const c = enemy.color;
  const t = enemy.type;

  if (t === 'slime') {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(40, 50, 22, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(34, 46, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(46, 46, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(35, 45, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(47, 45, 2, 0, Math.PI*2); ctx.fill();
  } else if (t === 'zombie') {
    ctx.fillStyle = c;
    ctx.fillRect(28, 28, 24, 30);
    ctx.fillStyle = '#c0a080';
    ctx.beginPath(); ctx.arc(40, 26, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(35, 24, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(45, 24, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(34,32); ctx.lineTo(24,44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(46,32); ctx.lineTo(56,40); ctx.stroke();
  } else if (t === 'ghost') {
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(40, 35, 18, Math.PI, 0);
    ctx.lineTo(58, 60);
    for (let i = 0; i < 4; i++) {
      ctx.arc(55-i*5, 60, 5, 0, Math.PI, i%2===0);
    }
    ctx.lineTo(22, 60); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#88aaff';
    ctx.beginPath(); ctx.arc(34, 34, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(46, 34, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(35, 33, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(47, 33, 2, 0, Math.PI*2); ctx.fill();
  } else if (t === 'eye') {
    ctx.fillStyle = '#1a0a0a';
    ctx.beginPath(); ctx.arc(40, 40, 28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(40, 40, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(40, 40, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff2020';
    ctx.beginPath(); ctx.arc(40, 40, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(36, 26, 4, 8);
    ctx.fillRect(26, 36, 8, 4);
    ctx.fillRect(46, 36, 8, 4);
    ctx.fillRect(36, 46, 4, 8);
  } else if (t === 'golem') {
    ctx.fillStyle = c;
    ctx.fillRect(20, 20, 40, 45);
    ctx.fillStyle = '#3a2a18';
    ctx.fillRect(16, 16, 48, 16);
    ctx.fillStyle = '#ff4444';
    ctx.beginPath(); ctx.arc(33, 28, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(47, 28, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c;
    ctx.fillRect(10, 28, 12, 24);
    ctx.fillRect(58, 28, 12, 24);
    ctx.fillStyle = '#2a1a0a';
    ctx.fillRect(26, 44, 28, 6);
  } else if (t === 'eldritch') {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#200a30';
    ctx.beginPath(); ctx.arc(40, 40, 30, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    for (let i = 0; i < 8; i++) {
      const angle = (i/8)*Math.PI*2;
      const r1 = 20, r2 = 32;
      ctx.strokeStyle = `hsl(${i*45},80%,40%)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(40+Math.cos(angle)*r1, 40+Math.sin(angle)*r1);
      ctx.lineTo(40+Math.cos(angle)*r2, 40+Math.sin(angle)*r2);
      ctx.stroke();
    }
    ctx.fillStyle = '#ff00ff';
    ctx.beginPath(); ctx.arc(40, 40, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(40, 40, 4, 0, Math.PI*2); ctx.fill();
  } else if (t === 'knight') {
    ctx.fillStyle = c;
    ctx.fillRect(26, 28, 28, 32);
    ctx.fillStyle = '#4a3020';
    ctx.fillRect(22, 20, 36, 14);
    ctx.fillStyle = '#ff3300';
    ctx.beginPath(); ctx.arc(35, 26, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(45, 26, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7a5030';
    ctx.fillRect(12, 30, 16, 20);
    ctx.fillRect(52, 30, 16, 20);
    ctx.fillStyle = '#c0a830';
    ctx.fillRect(60, 16, 4, 28);
    ctx.fillRect(56, 20, 10, 3);
  }
}

// ===== MESSAGES =====
function showMessage(text, callback) {
  const el = document.getElementById('message-text');
  const cursor = document.getElementById('message-cursor');
  if (!cursor) {
    el.innerHTML = text + '<span id="message-cursor"></span>';
  } else {
    el.innerHTML = text + '<span id="message-cursor"></span>';
  }
  state.msgCallback = callback;
}

function typeMessage(text, callback) {
  const el = document.getElementById('message-text');
  el.innerHTML = '';
  state.mode = 'dialog';
  state.msgCallback = null;
  let i = 0;
  let done = false;

  function finish() {
    if (done) return;
    done = true;
    el.innerHTML = text + '<span id="message-cursor"></span>';
    state.msgCallback = callback;
  }

  // タップで即全文表示できるよう、タイピング中もskip関数を登録
  state.skipTyping = finish;

  const timer = setInterval(() => {
    if (i < text.length) {
      el.innerHTML = text.substring(0, i+1) + '<span id="message-cursor"></span>';
      i++;
    } else {
      clearInterval(timer);
      finish();
      state.skipTyping = null;
    }
  }, 35);
}

// ===== MOVEMENT =====
function canWalk(x, y) {
  const map = state.mapData;
  if (y < 0 || y >= map.length || x < 0 || x >= map[0].length) return false;
  const t = map[y][x];
  return t !== T.WALL && t !== T.MOUNTAIN && t !== T.WATER && t !== T.TREE;
}

function getTileAt(x, y) {
  const map = state.mapData;
  if (y < 0 || y >= map.length || x < 0 || x >= map[0].length) return -1;
  return map[y][x];
}

function movePlayer(dx, dy) {
  if (state.mode !== 'field') return;
  const nx = player.x + dx, ny = player.y + dy;
  if (!canWalk(nx, ny)) return;

  player.x = nx; player.y = ny;
  renderMap();
  checkTile();
}

function checkTile() {
  const tile = getTileAt(player.x, player.y);

  // Town entrance
  if (tile === T.TOWN && state.currentMap === 'world') {
    enterTown();
    return;
  }

  // Door
  if (tile === T.DOOR) {
    return;
  }

  // NPC
  if (tile === T.NPC) {
    talkToNPC();
    return;
  }

  // Chest
  if (tile === T.CHEST) {
    openChest();
    return;
  }

  // Random encounter
  if (state.currentMap === 'world' || state.currentMap === 'ruin') {
    if (Math.random() < 0.18) {
      startBattle();
    }
  }
}

}

function talkToNPC() {
  state.mode = 'dialog';

  document.getElementById('command-window').classList.remove('visible');
  typeMessage(dialog[npcLineIdx % dialog.length], () => {

// ===== CHEST =====
const CHEST_ITEMS = ['やくそう','やくそう','まほうのたま','50ゴールド'];
let chestIdx = 0;
function openChest() {
  if (state.chestOpened.includes(player.x+','+player.y)) {
    typeMessage('箱の　中は　からだった。', () => setFieldMode());
    return;
  }
  state.chestOpened.push(player.x+','+player.y);
  state.mode = 'dialog';
  const item = CHEST_ITEMS[chestIdx % CHEST_ITEMS.length];
  chestIdx++;
  if (item === '50ゴールド') {
    player.gold += 50;
    updateStatus();
    typeMessage('宝箱を　あけた！\n50ゴールドを　てに　いれた！', () => setFieldMode());
  } else {
    const it = player.items.find(i=>i.name===item);
    if (it) it.count++;
    else player.items.push({name:item,count:1,type:'heal',power:item==='まほうのたま'?50:30});
    typeMessage('宝箱を　あけた！\n「'+item+'」を　てに　いれた！', () => setFieldMode());
  }
}

function openMenu(type) {

    document.getElementById('command-window').classList.remove('visible');

      player.name + '　Lv.' + player.lv + '\n' +
      'HP: ' + player.hp + '/' + player.maxHp + '　MP: ' + player.mp + '/' + player.maxMp + '\n' +
      'こうげき: ' + player.atk + '　ぼうぎょ: ' + player.def + '\n' +
      'けいけんち: ' + player.exp + '/' + player.expNext + '　G: ' + player.gold,
      () => setFieldMode()
    );
  } else if (type === 'search') {
    state.mode = 'dialog';
    document.getElementById('command-window').classList.remove('visible');
    const msgs = [
      '霧の　においが　する。\n深淵の　残滓が　大気に　漂っている。',
      'ここは　かつて　セラフィット帝国の\n版図だったと　伝えられている。',
      '遠くで　何かが　動く　気配……\nしかし　何も　見えない。',
    ];
    typeMessage(msgs[Math.floor(Math.random()*msgs.length)], () => setFieldMode());
  } else if (type === 'talk') {
    state.mode = 'dialog';
    document.getElementById('command-window').classList.remove('visible');
    typeMessage('このあたりに　話せる　ものは　いない。', () => setFieldMode());

    state.mode = 'dialog';

    const itemInfo = player.items.map(i=>i.name+'×'+i.count).join('\n');
    typeMessage('もちもの:\n' + itemInfo, () => setFieldMode());
  }
}

// ===== BATTLE =====
function startBattle() {
  const table = ENEMY_TABLE[state.currentMap] || ENEMY_TABLE.world;
  const eTemplate = table[Math.floor(Math.random()*table.length)];
  state.battleEnemy = {...eTemplate, hp: eTemplate.maxHp};
  state.mode = 'battle';
  state.battlePhase = 'command';

  document.getElementById('command-window').classList.remove('visible');
  document.getElementById('battle-screen').classList.add('visible');
  document.getElementById('spell-window').classList.remove('visible');
  document.getElementById('item-window').classList.remove('visible');
  document.getElementById('battle-cmd-grid').style.display = 'grid';

  drawEnemySprite(state.battleEnemy);
  document.getElementById('enemy-name-display').textContent = state.battleEnemy.name;
  updateEnemyHp();
  updateStatus();

  setBattleLog(state.battleEnemy.name + 'が　あらわれた！');
}

function updateEnemyHp() {
  const e = state.battleEnemy;
  const pct = Math.max(0, e.hp / e.maxHp * 100);
  document.getElementById('enemy-hp-fill').style.width = pct + '%';
}

function setBattleLog(text) {
  document.getElementById('battle-log').textContent = text;
}

function battleAction(action) {
  if (state.battlePhase !== 'command') return;
  const e = state.battleEnemy;

  if (action === 'attack') {
    state.battlePhase = 'player';
    const dmg = Math.max(1, player.atk - e.def + Math.floor(Math.random()*6) - 2);
    e.hp = Math.max(0, e.hp - dmg);
    updateEnemyHp();
    showDamage(dmg, 'enemy');
    setBattleLog(player.name + 'の　こうげき！\n' + e.name + 'に　' + dmg + 'ポイントの\nダメージを　あたえた！');
    setTimeout(() => {
      if (e.hp <= 0) { battleWin(); return; }
      enemyTurn();
    }, 1200);

  } else if (action === 'spell') {
    if (player.spells.length === 0) { setBattleLog('おぼえている　じゅもんが　ない。'); return; }
    showSpellMenu();

  } else if (action === 'item') {
    if (player.items.length === 0) { setBattleLog('どうぐを　なにも　もっていない。'); return; }
    showItemMenu();

  } else if (action === 'flee') {
    state.battlePhase = 'player';
    if (Math.random() < 0.5) {
      setBattleLog('うまく　にげきれた！');
      setTimeout(endBattle, 1000);
    } else {
      setBattleLog('しかし　まわりこまれた！');
      setTimeout(enemyTurn, 1000);
    }
  }
}

function showSpellMenu() {
  const list = document.getElementById('spell-list');
  list.innerHTML = '';
  document.getElementById('battle-cmd-grid').style.display = 'none';
  player.spells.forEach((sp,i) => {
    const canUse = player.mp >= sp.mp;
    const li = document.createElement('li');
    li.className = 'spell-item' + (canUse ? '' : ' spell-disabled');
    li.innerHTML = `<span>${sp.name}</span><span class="spell-mp">MP ${sp.mp}</span>`;
    if (canUse) li.onclick = () => castSpell(i);
    else li.onclick = () => setBattleLog('MPが　たりない！');
    list.appendChild(li);
  });
  // Back
  const back = document.createElement('li');
  back.className = 'spell-item';
  back.innerHTML = '<span>もどる</span>';
  back.onclick = () => {
    document.getElementById('spell-window').classList.remove('visible');
    document.getElementById('battle-cmd-grid').style.display = 'grid';
  };
  list.appendChild(back);
  document.getElementById('spell-window').classList.add('visible');
}

function castSpell(idx) {
  document.getElementById('spell-window').classList.remove('visible');
  document.getElementById('battle-cmd-grid').style.display = 'grid';
  state.battlePhase = 'player';
  const sp = player.spells[idx];
  const e = state.battleEnemy;
  player.mp = Math.max(0, player.mp - sp.mp);
  updateStatus();

  if (sp.type === 'heal') {
    const heal = sp.power + Math.floor(Math.random()*10);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    updateStatus();
    showDamage(heal, 'heal');
    setBattleLog(sp.name + '！\n' + player.name + 'のHPが　' + heal + 'ポイント　かいふくした！');
    setTimeout(enemyTurn, 1200);
  } else {
    const dmg = Math.max(1, sp.power - e.def + Math.floor(Math.random()*8));
    e.hp = Math.max(0, e.hp - dmg);
    updateEnemyHp();
    showDamage(dmg, 'enemy');
    setBattleLog(sp.name + '！\n' + e.name + 'に　' + dmg + 'ポイントの\nダメージを　あたえた！');
    setTimeout(() => {
      if (e.hp <= 0) { battleWin(); return; }
      enemyTurn();
    }, 1200);
  }
}

function showItemMenu() {
  const list = document.getElementById('item-list-battle');
  list.innerHTML = '';
  document.getElementById('battle-cmd-grid').style.display = 'none';
  player.items.forEach((it,i) => {
    const li = document.createElement('li');
    li.className = 'item-item';
    li.innerHTML = `<span>${it.name}</span><span class="item-count">×${it.count}</span>`;
    li.onclick = () => useItem(i);
    list.appendChild(li);
  });
  const back = document.createElement('li');
  back.className = 'item-item';
  back.innerHTML = '<span>もどる</span>';
  back.onclick = () => {
    document.getElementById('item-window').classList.remove('visible');
    document.getElementById('battle-cmd-grid').style.display = 'grid';
  };
  list.appendChild(back);
  document.getElementById('item-window').classList.add('visible');
}

function useItem(idx) {
  document.getElementById('item-window').classList.remove('visible');
  document.getElementById('battle-cmd-grid').style.display = 'grid';
  state.battlePhase = 'player';
  const it = player.items[idx];
  it.count--;
  if (it.count <= 0) player.items.splice(idx, 1);

  const heal = it.power + Math.floor(Math.random()*10);
  player.hp = Math.min(player.maxHp, player.hp + heal);
  updateStatus();
  showDamage(heal, 'heal');
  setBattleLog(it.name + 'を　つかった！\nHPが　' + heal + 'ポイント　かいふくした！');
  setTimeout(enemyTurn, 1200);
}

function enemyTurn() {
  const e = state.battleEnemy;
  const dmg = Math.max(1, e.atk - player.def + Math.floor(Math.random()*4) - 1);
  player.hp = Math.max(0, player.hp - dmg);
  updateStatus();
  showDamage(dmg, 'player');

  const msgs = [
    e.name + 'の　こうげき！\n' + player.name + 'は　' + dmg + 'ポイントの\nダメージを　うけた！',
    e.name + 'が　おそいかかる！\n' + dmg + 'ポイントの　ダメージ！',
  ];
  setBattleLog(msgs[Math.floor(Math.random()*msgs.length)]);

  if (player.hp <= 0) {
    setTimeout(gameOver, 1200);
    return;
  }
  setTimeout(() => {
    state.battlePhase = 'command';
    setBattleLog('どうする？');
  }, 1200);
}

function battleWin() {
  const e = state.battleEnemy;
  player.exp += e.exp;
  player.gold += e.gold;
  updateStatus();
  setBattleLog(e.name + 'を　たおした！\n' + e.exp + 'けいけんちを　かくとく！\n' + e.gold + 'ゴールドを　てに　いれた！');

  setTimeout(() => {
    checkLevelUp(() => {
      setTimeout(endBattle, 800);
    });
  }, 1400);
}

function checkLevelUp(cb) {
  if (player.exp >= player.expNext) {
    player.exp -= player.expNext;
    player.lv++;
    player.expNext = Math.floor(player.expNext * 1.8);
    const hpUp = 8 + Math.floor(Math.random()*6);
    const mpUp = 3 + Math.floor(Math.random()*3);
    const atkUp = 2 + Math.floor(Math.random()*2);
    const defUp = 1 + Math.floor(Math.random()*2);
    player.maxHp += hpUp;
    player.maxMp += mpUp;
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    player.atk += atkUp;
    player.def += defUp;

    const overlay = document.getElementById('levelup-overlay');
    overlay.classList.add('visible');
    document.getElementById('levelup-text').textContent =
      'Lv.' + player.lv + 'に　あがった！\nHP+'+hpUp+' MP+'+mpUp+' こうげき+'+atkUp+' ぼうぎょ+'+defUp;
    setBattleLog('レベルが　あがった！　Lv.' + player.lv + 'に　なった！');
    updateStatus();
    setTimeout(() => {
      overlay.classList.remove('visible');
      cb && cb();
    }, 2500);
  } else {
    cb && cb();
  }
}

function endBattle() {
  document.getElementById('battle-screen').classList.remove('visible');
  state.mode = 'field';
  setFieldMode();
  renderMap();
}

function gameOver() {
  document.getElementById('battle-screen').classList.remove('visible');
  document.getElementById('gameover-screen').classList.add('visible');
  state.mode = 'gameover';
}

function respawn() {
  player.hp = Math.floor(player.maxHp / 2);
  player.mp = player.maxMp;
  player.x = 4; player.y = 4;
  state.currentMap = 'world';
  state.mapData = WORLD_MAP;
  document.getElementById('gameover-screen').classList.remove('visible');
  updateStatus();
  renderMap();
  typeMessage('……目が　さめた。\nあなたは　メルクリアの　近くに\n倒れていた。', () => setFieldMode());
}

// ===== DAMAGE FLOAT =====
function showDamage(val, type) {
  const area = type === 'player'
    ? document.getElementById('battle-log')
    : document.getElementById('battle-enemy-area');
  const el = document.createElement('div');
  el.className = 'damage-float dmg-' + type;
  el.textContent = (type==='heal' ? '+' : '-') + val;
  el.style.left = '50%';
  el.style.transform = 'translateX(-50%)';
  el.style.bottom = type === 'player' ? 'auto' : '10px';
  el.style.top = type === 'player' ? '4px' : 'auto';
  el.style.position = 'absolute';
  area.style.position = 'relative';
  area.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// ===== FADE TRANSITION =====
function doFade(cb) {
  const t = document.getElementById('transition');
  t.classList.add('fade-in');
  setTimeout(() => {
    cb();
    t.classList.remove('fade-in');
  }, 350);
}

// ===== TOUCH / TAP MOVEMENT =====
let touchStartX = 0, touchStartY = 0;
let isDragging = false;

mapCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isDragging = false;
}, {passive:false});

mapCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state.mode !== 'field') return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  const threshold = 28;
  if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
    isDragging = true;
    if (Math.abs(dx) > Math.abs(dy)) {
      movePlayer(dx > 0 ? 1 : -1, 0);
    } else {
      movePlayer(0, dy > 0 ? 1 : -1);
    }
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, {passive:false});

// ===== UNIFIED MESSAGE TAP =====
function handleMessageTap() {
  if (state.mode !== 'dialog') return;
  // タイピング中ならスキップして全文表示
  if (state.skipTyping) {
    state.skipTyping();
    state.skipTyping = null;
    return;
  }
  // 全文表示済みならコールバック実行
  if (state.msgCallback) {
    const cb = state.msgCallback;
    state.msgCallback = null;
    cb();
  }
}

mapCanvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (isDragging) return;
  if (state.mode === 'dialog') {
    handleMessageTap();
    return;
  }
  if (state.mode === 'field') {
    const rect = mapCanvas.getBoundingClientRect();
    const scaleX = mapCanvas.width / rect.width;
    const scaleY = mapCanvas.height / rect.height;
    const tx = (e.changedTouches[0].clientX - rect.left) * scaleX;
    const ty = (e.changedTouches[0].clientY - rect.top) * scaleY;
    const tileX = Math.floor(tx / TILE);
    const tileY = Math.floor(ty / TILE);
    const map = state.mapData;
    const rows = map.length, cols = map[0].length;
    const camX = Math.max(0, Math.min(player.x - Math.floor(VIEW_W/2), cols - VIEW_W));
    const camY = Math.max(0, Math.min(player.y - Math.floor(VIEW_H/2), rows - VIEW_H));
    const worldX = camX + tileX;
    const worldY = camY + tileY;
    const dx = worldX - player.x;
    const dy = worldY - player.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      movePlayer(dx > 0 ? 1 : -1, 0);
    } else if (Math.abs(dy) > 0) {
      movePlayer(0, dy > 0 ? 1 : -1);
    }
  }
}, {passive:false});

// メッセージウィンドウのタップ
document.getElementById('message-window').addEventListener('touchend', e => {
  e.preventDefault();
  handleMessageTap();
}, {passive:false});

// PC用クリック
mapCanvas.addEventListener('click', e => {
  if (state.mode === 'dialog') {
    handleMessageTap();
    return;
  }
  if (state.mode === 'field') {
    const rect = mapCanvas.getBoundingClientRect();
    const scaleX = mapCanvas.width / rect.width;
    const scaleY = mapCanvas.height / rect.height;
    const tx = (e.clientX - rect.left) * scaleX;
    const ty = (e.clientY - rect.top) * scaleY;
    const tileX = Math.floor(tx / TILE);
    const tileY = Math.floor(ty / TILE);
    const map = state.mapData;
    const rows = map.length, cols = map[0].length;
    const camX = Math.max(0, Math.min(player.x - Math.floor(VIEW_W/2), cols - VIEW_W));
    const camY = Math.max(0, Math.min(player.y - Math.floor(VIEW_H/2), rows - VIEW_H));
    const worldX = camX + tileX;
    const worldY = camY + tileY;
    const dx = worldX - player.x;
    const dy = worldY - player.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      movePlayer(dx > 0 ? 1 : -1, 0);
    } else if (Math.abs(dy) > 0) {
      movePlayer(0, dy > 0 ? 1 : -1);
    }
  }
});

document.getElementById('message-window').addEventListener('click', () => {
  if (state.mode === 'dialog' && state.msgCallback) {
    const cb = state.msgCallback;
    state.msgCallback = null;
    cb();
  }
});

// ===== KEYBOARD (desktop) =====
document.addEventListener('keydown', e => {
  if (state.mode === 'field') {
    if (e.key==='ArrowUp'||e.key==='w') movePlayer(0,-1);
    if (e.key==='ArrowDown'||e.key==='s') movePlayer(0,1);
    if (e.key==='ArrowLeft'||e.key==='a') movePlayer(-1,0);
    if (e.key==='ArrowRight'||e.key==='d') movePlayer(1,0);
  }
  if ((e.key===' '||e.key==='Enter') && state.mode==='dialog') {
    handleMessageTap();
  }
});

// ===== START =====
function startGame() {
  doFade(() => {
    document.getElementById('title-screen').style.display = 'none';
    resizeCanvas();
    updateStatus();
    typeMessage(
      'ここは　アルゴス大陸。\n大崩壊より　二百五十年。\n廃墟には　今も　怪異が　潜む……\n\nあなたの　旅が　はじまる。',
      () => {
        typeMessage(
          '自由都市　メルクリアの　近くに\nあなたは　立っている。\nマップを　タップして　移動しよう。',
          () => setFieldMode()
        );
      }
    );
  });
}

// スマホのアドレスバー考慮した高さ調整
function fixHeight() {
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.getElementById('game-container').style.height = h + 'px';
}
fixHeight();
window.addEventListener('resize', () => { fixHeight(); resizeCanvas(); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => { fixHeight(); resizeCanvas(); });
}
</script>
